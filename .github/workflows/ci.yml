name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # No debug info: much faster links and a smaller cache; CI does not need the symbols.
      CARGO_PROFILE_DEV_DEBUG: 0
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      - name: Install iced system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev mold

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - uses: taiki-e/install-action@nextest

      # Test binaries run in parallel; plain cargo test runs them one at a time.
      - name: Rust tests
        run: cargo nextest run --all-targets --locked

  msrv:
    name: Build on declared MSRV
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v5

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          VERSION="$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"
          [[ -n "$VERSION" ]] || { echo "rust-version not found in Cargo.toml" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install pinned toolchain
        run: |
          rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
          rustup default "${{ steps.msrv.outputs.version }}"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      - name: Check
        run: cargo check --all-targets --locked

  applet:
    name: Check COSMIC applet
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      - name: Install libcosmic system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev pkg-config

      - name: Check applet
        run: cargo check -p agentdeck-applet --locked

  release-cache:
    name: Warm release cache (${{ matrix.package }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [agentdeck, agentdeck-applet]
    env:
      # Must match release.yml so rust-cache keys align and tag builds restore main's cache.
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.package }}-${{ hashFiles('Cargo.toml') }}"

      - name: Install system dependencies
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev mold

      - name: Warm release dependencies
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked -p ${{ matrix.package }}
