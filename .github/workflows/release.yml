name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        package: [agentdeck, agentdeck-applet]
    env:
      # Must match ci.yml release-cache so tags restore main's compiled release dependencies.
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid version: $VERSION" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.package }}"
          # Tag-scoped caches are unreadable by subsequent tags; main's release-cache saves them.
          save-if: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev mold

      - name: Build
        run: |
          cargo build --release --locked -p ${{ matrix.package }}

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir -p dist
          stage="dist/$PACKAGE-$VERSION-x86_64"
          mkdir -p "$stage"
          install -m 0755 "target/release/$PACKAGE" "$stage/$PACKAGE"
          cp LICENSE README.md "$stage/"
          tar -C dist -czf "$stage.tar.gz" "$(basename "$stage")"
          rm -rf "$stage"
          if [[ "$PACKAGE" == "agentdeck" ]]; then
            cp crates/agentdeck/agentdeck.desktop crates/agentdeck/assets/agentdeck.svg dist/
          fi
          ls dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-x86_64
          path: dist/*
          if-no-files-found: error
          # Only hands the files to the publish job; the release keeps them.
          retention-days: 1

  publish:
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-x86_64"
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          EXTRA=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            EXTRA+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/agentdeck.desktop dist/agentdeck.svg \
            --generate-notes --verify-tag "${EXTRA[@]}"
