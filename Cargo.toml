[workspace]
members = ["crates/*"]
# libcosmic is heavy: the applet builds in its own CI job, not in the default gates.
default-members = ["crates/agentdeck", "crates/agentdeck-core", "crates/agentdeck-gui", "crates/agentdeck-usage", "crates/agent-process", "crates/agentdeck-approver", "crates/agentdeck-coordinator"]
resolver = "2"

[workspace.package]
rust-version = "1.93"

# Speed up software rasterization in `iced_test` headless GUI snapshots.
[profile.dev.package.tiny-skia]
opt-level = 2

[profile.dev.package.tiny-skia-path]
opt-level = 2

[profile.dev.package.cosmic-text]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2

[profile.release]
# Skip cross-crate LTO so warm-cache release builds finish quickly on free runners.
strip = true
