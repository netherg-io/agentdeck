[package]
name = "agentdeck-coordinator"
version = "0.1.38"
edition = "2024"
description = "External Watchdog, Coordinator Pool rotation, Jev-gated Checkpoints and pre-dispatch hygiene for long-horizon Autonomous Runs (ADR-0002)"
license = "GPL-3.0-or-later"
repository = "https://github.com/netherg-io/agentdeck"
rust-version = "1.93"

[dependencies]
agentdeck-core = { path = "../agentdeck-core" }
anyhow = "1.0"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.47", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["rt", "macros"] }
