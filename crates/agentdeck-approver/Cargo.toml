[package]
name = "agentdeck-approver"
version = "0.1.23"
edition = "2024"
description = "Local approval broker with Hard-Deny Perimeter, Policy Judge and Telegram long-polling"
license = "GPL-3.0-or-later"
repository = "https://github.com/netherg-io/agentdeck"
rust-version = "1.93"

[dependencies]
agentdeck-core = { path = "../agentdeck-core" }
anyhow = "1.0"
libc = "0.2"
regex = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["test-util"] }
