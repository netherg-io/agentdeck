[package]
name = "agentdeck"
version = "0.1.14"
edition = "2024"
description = "Manage Claude Code, Codex, OpenCode and Antigravity accounts"
license = "GPL-3.0-or-later"
repository = "https://github.com/netherg-io/agentdeck"
rust-version = "1.93"

[dependencies]
libc = "0.2"
agent-process = { path = "../agent-process" }
agentdeck-core = { path = "../agentdeck-core" }
agentdeck-router = { path = "../agentdeck-router" }
agentdeck-gui = { path = "../agentdeck-gui" }
agentdeck-usage = { path = "../agentdeck-usage" }
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
notify = "8"
notify-debouncer-mini = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
